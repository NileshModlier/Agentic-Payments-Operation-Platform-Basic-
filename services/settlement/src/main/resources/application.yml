spring:
  config:
    import: classpath:apop-observability.yml
  application:
    name: settlement-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5434/settlement
    username: settlement
    password: settlement
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/settlement
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: payment-settlement-executor
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    template:
      observation-enabled: true
    listener:
      ack-mode: record
      observation-enabled: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

apop:
  payment:
    base-url: http://localhost:8080
  ledger:
    base-url: http://localhost:8081
    clearing-account-id: 00000000-0000-7000-8000-000000000001
  messaging:
    enabled: true
    lifecycle-topic: payments.payment.lifecycle.v1
    item-topic: payments.settlement.item.v1
    partitions: 12
    replicas: 1
    relay-delay-ms: 500
    retry-delay-ms: 2000
