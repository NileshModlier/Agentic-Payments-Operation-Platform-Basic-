spring:
  config:
    import: classpath:apop-observability.yml
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/initiation
    username: initiation
    password: initiation
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/payment
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: transaction-history-projector
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    template:
      observation-enabled: true
    listener:
      ack-mode: record
      observation-enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

apop:
  default-legal-entity: SIM-BANK
  fraud:
    mode: fail-closed
  ledger:
    base-url: http://localhost:8081
  validation:
    max-amount-minor: 1000000000
    zone: America/New_York
    cutoff: "17:00"
  remittance-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  messaging:
    enabled: true
    topic: payments.payment.lifecycle.v1
    partitions: 12
    replicas: 1
    relay-delay-ms: 500
