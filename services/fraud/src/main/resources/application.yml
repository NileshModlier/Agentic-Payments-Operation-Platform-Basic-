spring:
  config:
    import: classpath:apop-observability.yml
  application:
    name: fraud-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5435/fraud
    username: fraud
    password: fraud
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/fraud
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    template:
      observation-enabled: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

apop:
  pepper: local-dev-pepper
  messaging:
    enabled: true
    assessment-topic: payments.fraud.assessment.v1
    audit-topic: platform.audit.recorded.v1
    partitions: 12
    replicas: 1
    relay-delay-ms: 500
