services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports:
      - "5435:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  fraud:
    build: .
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fraud
      SPRING_DATA_REDIS_HOST: redis
      APOP_MESSAGING_ENABLED: "false"
    depends_on:
      - postgres
      - redis
