management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${APOP_TRACE_SAMPLE:1.0}
  otlp:
    metrics:
      export:
        enabled: ${APOP_OTLP_METRICS_ENABLED:false}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 200ms,800ms
        apop.settlement.lag: 1s,2s,5s
